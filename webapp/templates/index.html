<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDR &amp; IPDR Agent Console</title>
  <script>
    // Apply the saved theme before first paint (default: light).
    try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
    <span>CDR &amp; IPDR Agent Console</span>
  </div>
  <div class="topbar-right">
    <label class="history">Run
      <select id="runSelect"><option value="">— no runs yet —</option></select>
    </label>
    <span id="statusPill" class="pill pill-idle">Idle</span>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
    </button>
  </div>
</header>

<main>
  <!-- Command -->
  <section class="card command accent-indigo">
    <form id="runForm">
      <label for="prompt" class="label">Instruction</label>
      <div class="prompt-row">
        <textarea id="prompt" rows="2" placeholder='e.g. "Run all agents"  ·  "Run the cdr-analyst and viz-generator agents"  ·  "Run link-analyzer and regenerate visuals"'></textarea>
        <div class="prompt-actions">
          <button type="submit" id="runBtn" class="btn primary">Run</button>
          <button type="button" id="stopBtn" class="btn danger" hidden>Stop</button>
        </div>
      </div>
      <div class="chips-row">
        <button type="button" class="chip chip-all" data-all>Run all agents</button>
        <span class="chips-sep">or pick agents:</span>
        <div id="agentChips" class="chips"></div>
        <label class="model">Model
          <select id="model">
            <option value="">Default</option>
            <option value="sonnet">Sonnet</option>
            <option value="opus">Opus</option>
            <option value="haiku">Haiku</option>
          </select>
        </label>
      </div>
      <p id="rawFiles" class="muted small"></p>
      <p id="formError" class="error small" hidden></p>
    </form>
  </section>

  <!-- Status -->
  <section class="card accent-teal">
    <div class="section-head">
      <h2>Run status</h2>
      <span id="runMeta" class="muted small"></span>
    </div>
    <div id="pipeline" class="pipeline"></div>
    <details id="feedWrap" class="feed-wrap" open>
      <summary>Live activity <span id="feedCount" class="muted small"></span></summary>
      <ol id="feed" class="feed"></ol>
    </details>
  </section>

  <!-- Outputs -->
  <section class="card outputs accent-pink">
    <div class="section-head">
      <h2>Outputs</h2>
      <div class="out-actions">
        <label class="toggle"><input type="checkbox" id="onlyChanged"> Only files changed in this run</label>
        <a id="dlRun" class="btn" hidden>Download this run's files (.zip)</a>
        <a id="dlAll" class="btn primary" href="/api/zip?scope=all">Download all (.zip)</a>
      </div>
    </div>
    <nav id="tabs" class="tabs" role="tablist"></nav>
    <div id="tabBody" class="tab-body"></div>
  </section>
</main>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" hidden>
  <div class="lb-inner">
    <div class="lb-head">
      <div><strong id="lbTitle"></strong><div id="lbCaption" class="muted small"></div></div>
      <div class="lb-btns">
        <a id="lbDownload" class="btn">Download</a>
        <button id="lbClose" class="btn" aria-label="Close">✕</button>
      </div>
    </div>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">‹</button>
    <img id="lbImg" alt="">
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next">›</button>
  </div>
</div>
</body>
</html>
